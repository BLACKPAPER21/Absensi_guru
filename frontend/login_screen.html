<div class="w-full max-w-[420px] bg-surface-container-lowest rounded-xl shadow-[0_4px_24px_rgba(11,28,48,0.04)] border border-surface-container flex flex-col p-margin-page gap-stack-lg relative overflow-hidden">

<div class="w-16 h-16 rounded-lg bg-surface-container-low flex items-center justify-center mb-base border border-surface-variant overflow-hidden">
<img alt="SIGURU Logo" class="w-full h-full object-cover" data-alt="A clean, minimalist abstract geometric logo design designed for a modern educational management platform named SIGURU. The logo symbol incorporates subtle visual cues of an open book and a shield, symbolizing both academic learning and institutional security. It is rendered in a sharp, professional teal color palette against a pristine white background. The overall aesthetic is highly corporate, trustworthy, and precise, resembling a high-end vector illustration suitable for a secure login screen. The lighting is completely flat, emphasizing the crisp edges and mathematical perfection of the intersecting shapes." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAe_Ax6rGAcs9AB1DxHu6HeF2R9a2coewZWDqfCbhZXtXD588jJaxVjnOY6uKOJZ3tAZKomMpnoSK9Q4HA9wiVwcOcjHdcwP4WVlVeRuA8r1mibC5Vx4r8qY3VJdtOyWpEMd-N_9jnORrIeOqj_5bs4vCNnZbs_s-jg5YRzA-6rgGejFDboNPXNP3RtfKgb_WEB00bo41iJqWUA-ycQOMU5VQNPZxWVvPlV1Omu0zq4Xf1XB7qCmyy_DIQbz7nUo1UPvzUhQoMrCGu-"/>

<h1 class="font-headline-md text-headline-md text-on-surface">Welcome to SIGURU</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Academic Management System</p>
</div>
<form class="flex flex-col gap-stack-lg">
<div class="flex flex-col gap-stack-md">
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="mail">mail</span>
<input class="w-full pl-10 pr-4 py-3 rounded-lg bg-surface border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="email" placeholder="admin@school.edu" type="email"/>
</div>
</div>
<div class="flex flex-col gap-stack-sm relative">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-outline" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-10 py-3 rounded-lg bg-surface border border-outline-variant text-on-surface font-body-md text-body-md focus:outline-none focus:border-secondary focus:ring-1 focus:ring-secondary transition-colors" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 text-outline hover:text-on-surface transition-colors flex items-center" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
</div>
<div class="flex items-center justify-between">
<div class="flex items-center gap-2">
<input class="w-4 h-4 rounded border-outline-variant text-secondary focus:ring-secondary bg-surface" id="remember" type="checkbox"/>
<label class="font-label-md text-label-md text-on-surface-variant cursor-pointer" for="remember">Remember Me</label>
</div>
<a class="font-label-md text-label-md text-secondary hover:text-on-secondary-container transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full py-3 px-4 rounded-lg bg-secondary text-on-secondary font-label-md text-label-md hover:bg-on-secondary-container transition-colors mt-base flex justify-center items-center gap-2" type="submit">
                Sign In
                <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-stack-md text-center">
<p class="font-label-sm text-label-sm text-outline">
                Need help accessing your account? <a class="text-secondary hover:underline" href="#">Contact Support</a>
</p>
</div>
</div>
